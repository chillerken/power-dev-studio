name: Build AI Creator Studio APK
on:
  push:
    branches: [ai-studio-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate JavaScript
        run: node --check ai-studio-apk-build/app/src/main/assets/app-mobile.js
      - name: Build debug APK
        working-directory: ai-studio-apk-build
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: |
          APK="ai-studio-apk-build/app/build/outputs/apk/debug/app-debug.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" AI-Creator-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: AI-Creator-Studio.apk
          if-no-files-found: error
