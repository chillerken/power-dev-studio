name: Build AI Creator Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apk-build/**"
      - ".github/workflows/build-ai-creator-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore AI Creator Studio source
        shell: bash
        run: |
          rm -rf apk-build/work
          mkdir -p apk-build/work
          cat apk-build/chunk*.b64 | base64 --decode > apk-build/source.zip
          unzip -q apk-build/source.zip -d apk-build/work
          test -f apk-build/work/package.json
          test -f apk-build/work/capacitor.config.json
          test -f apk-build/work/public/index.html

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android API 36 using runner SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: apk-build/work
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: apk-build/work
        run: npm run android:prepare

      - name: Build debug APK
        working-directory: apk-build/work
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -f apk-build/work/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apk-build/work/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Creator-Studio-APK
          path: apk-build/work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
