<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>AI Creator Studio</title>
<style>
:root{--bg:#080b14;--p:#10172a;--p2:#151e34;--line:#293552;--text:#f7f9ff;--muted:#9aa8c5;--a:#7c3aed;--b:#0ea5e9;--ok:#10b981;--bad:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#18274b 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:#172039;color:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--a),#5b21b6);border-color:transparent}.btn.danger{background:#321313;border-color:#7f1d1d;color:#fecaca}.btn.sm{padding:6px 9px;font-size:12px}.input,.textarea,.select{width:100%;background:#0b1120;color:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}.textarea{min-height:110px;resize:vertical}.card{background:linear-gradient(180deg,#121a2e,#0e1425);border:1px solid var(--line);border-radius:17px;padding:16px}.grid{display:grid;gap:14px}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:#cbd5e1}.notice{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#0d1527}.error{border-color:#7f1d1d;color:#fecaca;background:#2b1010}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.authbox{width:min(450px,100%);padding:24px;border:1px solid var(--line);border-radius:22px;background:rgba(14,20,37,.95)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900}.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b))}.tabs{display:flex;gap:8px;margin:20px 0}.tabs .btn{flex:1}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:12px;color:#b9c5db;font-weight:700}
.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:16px;background:#090d17;display:flex;flex-direction:column;gap:18px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#c5d0e7;text-align:left;padding:10px;border-radius:9px}.nav button:hover,.nav button.on{background:#172039;color:#fff}.sidefoot{margin-top:auto}.top{height:64px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(8,11,20,.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.main{min-width:0}.content{padding:20px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.head h1{margin:0;font-size:30px}.projects{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,1fr)}.stat{font-size:29px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{padding:30px;text-align:center;border:1px dashed #3c4866;border-radius:13px;color:var(--muted)}
.chat{display:grid;grid-template-columns:1fr 300px;gap:14px}.messages{height:450px;overflow:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:11px 13px;border-radius:13px;line-height:1.5}.msg.me{align-self:flex-end;background:#5b21b6}.msg.ai{align-self:flex-start;background:#18223a;border:1px solid var(--line)}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.builder{display:grid;grid-template-columns:230px 1fr 270px;gap:10px;min-height:650px}.panel{background:#0d1425;border:1px solid var(--line);border-radius:14px;padding:12px}.tool{width:100%;margin:5px 0;text-align:left;border:1px dashed #455272;background:#131c31;color:#fff;padding:9px;border-radius:9px}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.device{background:#fff;color:#111;border-radius:14px;overflow:hidden;min-height:590px;margin:auto;transition:.2s}.device.mobile{width:min(390px,100%)}.block{position:relative;outline:2px solid transparent}.block.sel{outline-color:#8b5cf6;outline-offset:-2px}.btools{position:absolute;right:8px;top:8px;z-index:3;display:flex;gap:4px}.btools button{border:0;background:#111827;color:#fff;border-radius:7px;padding:5px 7px}.hero{padding:55px 7%;min-height:320px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:8px 0}.section{padding:38px 7%}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feat{padding:14px;border:1px solid #d1d5db;border-radius:10px}.cta{display:inline-block;padding:10px 15px;border-radius:9px;color:#fff;background:#7c3aed;font-weight:800}.inspector{display:grid;gap:8px}.drag{outline:2px dashed #8b5cf6!important}
.logos{grid-template-columns:repeat(2,1fr)}.logo{background:#fff;border-radius:14px;padding:12px}.logo svg{width:100%;height:auto}.social{grid-template-columns:repeat(3,1fr)}pre{white-space:pre-wrap;font:inherit;line-height:1.5}.hamb{display:none}
@media(max-width:1050px){.builder{grid-template-columns:210px 1fr}.builder>.panel:last-child{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}.projects{grid-template-columns:repeat(2,1fr)}.social{grid-template-columns:1fr}.chat{grid-template-columns:1fr}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-250px;width:230px;z-index:50;transition:.2s}.side.open{left:0}.hamb{display:inline-flex}.content{padding:12px}.head{flex-direction:column}.stats,.projects,.logos{grid-template-columns:1fr}.builder{grid-template-columns:1fr}.builder>.panel:first-child{order:2}.builder>.panel:last-child{order:3}.features{grid-template-columns:1fr}.composer{grid-template-columns:1fr}.msg{max-width:94%}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)}, $$=function(s){return Array.from(document.querySelectorAll(s))};
var DB={U:"acs_users",P:"acs_projects",S:"acs_session",A:"acs_activity",R:"acs_rate"};
var state={user:null,projects:[],current:null,route:"dashboard",selected:null,history:[],future:[],device:"desktop",msgs:[]};
function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}} function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clean(s,n){return String(s||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,n||4000)}
function toast(t){var x=document.createElement("div");x.className="card";x.style.cssText="position:fixed;right:16px;bottom:16px;z-index:100;max-width:320px";x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2300)}
function log(a){var x=read(DB.A,[]);x.unshift({a:a,t:new Date().toISOString(),u:state.user?state.user.id:null});write(DB.A,x.slice(0,100))}
function bytesHex(a){return Array.from(new Uint8Array(a)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
function hexBytes(s){var a=new Uint8Array(s.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(s.substr(i*2,2),16);return a}
async function hash(p,saltHex){var enc=new TextEncoder(),salt=saltHex?hexBytes(saltHex):crypto.getRandomValues(new Uint8Array(16));var key=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:180000,hash:"SHA-256"},key,256);return {salt:bytesHex(salt),hash:bytesHex(bits)}}
function rate(key,max){var r=read(DB.R,{}),n=Date.now(),x=r[key]||[];x=x.filter(function(t){return n-t<60000});if(x.length>=max)throw new Error("Te veel pogingen. Probeer straks opnieuw.");x.push(n);r[key]=x;write(DB.R,r)}
function sessionUser(){var sid=read(DB.S,null);if(!sid)return null;return read(DB.U,[]).find(function(u){return u.id===sid})||null}
function defaultContent(name){return {blocks:[
{id:uid(),type:"hero",props:{title:name||"Nieuwe website",text:"Een moderne website, gebouwd vanuit één prompt.",button:"Start nu",bg:"#111827",color:"#ffffff"}},
{id:uid(),type:"features",props:{title:"Waarom kiezen voor ons?",items:["Snel","Professioneel","Responsive"],bg:"#ffffff",color:"#111827"}},
{id:uid(),type:"text",props:{title:"Over ons",text:"Pas deze inhoud aan in de visuele editor.",bg:"#f8fafc",color:"#111827"}}
]}}
function myProjects(){return read(DB.P,[]).filter(function(p){return p.userId===state.user.id})}
function saveProjects(all){write(DB.P,all)}
function createProject(name,type){var all=read(DB.P,[]),p={id:uid(),userId:state.user.id,name:clean(name,80)||"Nieuw project",type:type||"website",created:new Date().toISOString(),updated:new Date().toISOString(),content:defaultContent(name)};all.unshift(p);saveProjects(all);log("project_create");return p}
function saveCurrent(){if(!state.current)return;var all=read(DB.P,[]),i=all.findIndex(function(p){return p.id===state.current.id&&p.userId===state.user.id});if(i<0)return;state.current.updated=new Date().toISOString();all[i]=JSON.parse(JSON.stringify(state.current));saveProjects(all);state.projects=myProjects();var s=$("#save");if(s){s.textContent="Opgeslagen";setTimeout(function(){if(s)s.textContent=""},900)}}
var timer=null;function autosave(){var s=$("#save");if(s)s.textContent="Opslaan…";clearTimeout(timer);timer=setTimeout(saveCurrent,350)}
function pushHistory(){if(!state.current)return;state.history.push(JSON.stringify(state.current.content));if(state.history.length>40)state.history.shift();state.future=[]}
function navHtml(){var n=[["dashboard","Dashboard"],["chat","AI Chat"],["builder","Website Builder"],["logo","Logo Studio"],["social","Social Studio"]];if(state.user.role==="admin")n.push(["admin","Admin"]);n.push(["account","Account"]);return n.map(function(x){return '<button data-nav="'+x[0]+'" class="'+(state.route===x[0]?"on":"")+'">'+x[1]+"</button>"}).join("")}
function shell(body,title){$("#app").innerHTML='<div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark">AI</div><span>Creator Studio</span></div><div class="nav">'+navHtml()+'</div><div class="sidefoot card"><div><b>'+esc(state.user.name)+'</b></div><div class="small muted">'+esc(state.user.email)+'</div><button class="btn sm" id="logout">Uitloggen</button></div></aside><main class="main"><header class="top"><div class="actions"><button class="btn sm hamb" id="hamb">☰</button><b>'+esc(title||"Studio")+'</b></div><span class="badge">Offline AI • v1.0</span></header><div class="content">'+body+'</div></main></div>';$$("[data-nav]").forEach(function(b){b.onclick=function(){state.route=b.dataset.nav;render()}});$("#logout").onclick=function(){localStorage.removeItem(DB.S);state.user=null;renderAuth()};var h=$("#hamb");if(h)h.onclick=function(){$("#side").classList.toggle("open")}}
function renderAuth(){var login=true;function draw(){$("#app").innerHTML='<div class="auth"><div class="authbox"><div class="brand"><div class="mark">AI</div><span>AI Creator Studio</span></div><p class="muted">Website, logo en social content in één Android studio.</p><div class="tabs"><button class="btn '+(login?"primary":"")+'" id="lt">Inloggen</button><button class="btn '+(!login?"primary":"")+'" id="rt">Registreren</button></div><div id="err"></div>'+(login?'<div class="field"><label>E-mail</label><input class="input" id="email" type="email"></div><div class="field"><label>Wachtwoord</label><input class="input" id="pass" type="password"></div><button class="btn primary" id="go">Inloggen</button>':'<div class="field"><label>Naam</label><input class="input" id="name"></div><div class="field"><label>E-mail</label><input class="input" id="email" type="email"></div><div class="field"><label>Wachtwoord</label><input class="input" id="pass" type="password" placeholder="Min. 10 tekens, hoofdletter, cijfer en teken"></div><button class="btn primary" id="go">Account maken</button>')+'</div></div>';$("#lt").onclick=function(){login=true;draw()};$("#rt").onclick=function(){login=false;draw()};$("#go").onclick=async function(){var err=$("#err");try{rate("auth",8);var email=clean($("#email").value,120).toLowerCase(),pass=$("#pass").value;if(!/^[^@]+@[^@]+\.[^@]+$/.test(email))throw new Error("Ongeldig e-mailadres");if(login){var u=read(DB.U,[]).find(function(x){return x.email===email});if(!u)throw new Error("Account niet gevonden");var z=await hash(pass,u.salt);if(z.hash!==u.hash)throw new Error("Onjuist wachtwoord");write(DB.S,u.id);state.user=u;log("login");boot()}else{var name=clean($("#name").value,80);if(name.length<2)throw new Error("Naam is te kort");if(pass.length<10||!/[A-Z]/.test(pass)||!/[0-9]/.test(pass)||!/[!@#$%^&*()_\-+=.]/.test(pass))throw new Error("Gebruik 10+ tekens, hoofdletter, cijfer en speciaal teken");var us=read(DB.U,[]);if(us.some(function(x){return x.email===email}))throw new Error("E-mail bestaat al");var hp=await hash(pass),u2={id:uid(),name:name,email:email,salt:hp.salt,hash:hp.hash,role:us.length===0?"admin":"user",created:new Date().toISOString()};us.push(u2);write(DB.U,us);write(DB.S,u2.id);state.user=u2;log("register");boot()}}catch(e){err.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}}draw()}
function boot(){state.user=sessionUser();if(!state.user)return renderAuth();state.projects=myProjects();if(!state.current&&state.projects.length)state.current=state.projects[0];render()}
function render(){if(!state.user)return renderAuth();state.projects=myProjects();if(state.route==="dashboard")dashboard();else if(state.route==="chat")chat();else if(state.route==="builder")builder();else if(state.route==="logo")logo();else if(state.route==="social")social();else if(state.route==="admin")admin();else account()}
function dashboard(){shell('<div class="head"><div><h1>Projectdashboard</h1><p class="muted">Al je websites en creaties.</p></div><button class="btn primary" id="new">+ Nieuw project</button></div><div class="grid stats"><div class="card"><span class="muted small">Projecten</span><div class="stat">'+state.projects.length+'</div></div><div class="card"><span class="muted small">Websites</span><div class="stat">'+state.projects.filter(function(p){return p.type==="website"}).length+'</div></div><div class="card"><span class="muted small">AI modus</span><div class="stat" style="font-size:20px">Lokaal</div></div><div class="card"><span class="muted small">Autosave</span><div class="stat" style="font-size:20px">Actief</div></div></div><div style="height:14px"></div><div class="grid projects">'+(state.projects.length?state.projects.map(function(p){return '<div class="card"><span class="badge">'+esc(p.type)+'</span><h3>'+esc(p.name)+'</h3><p class="small muted">Gewijzigd '+new Date(p.updated).toLocaleString("nl-BE")+'</p><div class="actions"><button class="btn sm primary" data-open="'+p.id+'">Open</button><button class="btn sm" data-copy="'+p.id+'">Dupliceer</button><button class="btn sm danger" data-del="'+p.id+'">Verwijder</button></div></div>'}).join(""):'<div class="empty">Nog geen projecten.</div>')+'</div>',"Dashboard");$("#new").onclick=function(){var p=createProject("Nieuw websiteproject","website");state.current=p;state.route="builder";render()};$$("[data-open]").forEach(function(b){b.onclick=function(){state.current=state.projects.find(function(p){return p.id===b.dataset.open});state.route="builder";render()}});$$("[data-copy]").forEach(function(b){b.onclick=function(){var p=state.projects.find(function(x){return x.id===b.dataset.copy}),n=createProject(p.name+" kopie",p.type);n.content=JSON.parse(JSON.stringify(p.content));state.current=n;saveCurrent();render()}});$$("[data-del]").forEach(function(b){b.onclick=function(){if(!confirm("Project verwijderen?"))return;var all=read(DB.P,[]).filter(function(p){return !(p.id===b.dataset.del&&p.userId===state.user.id)});saveProjects(all);if(state.current&&state.current.id===b.dataset.del)state.current=null;log("project_delete");render()}})}
function chat(){shell('<div class="head"><div><h1>AI Chat</h1><p class="muted">Centrale hub voor opdrachten.</p></div></div><div class="chat"><div class="card"><div class="messages" id="messages">'+(state.msgs.length?state.msgs.map(function(m){return '<div class="msg '+m.who+'">'+esc(m.text)+'</div>'}).join(""):'<div class="msg ai">Beschrijf een website, logo of social campagne. Ik zet je opdracht om in een bruikbaar resultaat.</div>')+'</div><div class="composer"><textarea class="textarea" id="prompt" placeholder="Maak een premium website voor..."></textarea><button class="btn primary" id="send">Stuur</button></div></div><div class="card"><h3>Snelle acties</h3><button class="tool" data-q="Maak een moderne zakelijke website">Website maken</button><button class="tool" data-q="Genereer een minimalistisch logo">Logo concept</button><button class="tool" data-q="Maak social posts voor een promotie">Social campagne</button></div></div>',"AI Chat");function go(q){q=clean(q,1200);if(!q)return;state.msgs.push({who:"me",text:q});var lower=q.toLowerCase(),reply="Opdracht verwerkt. ";if(lower.includes("logo")){reply+="Open Logo Studio om vier SVG-concepten te genereren.";state.route="logo"}else if(lower.includes("social")||lower.includes("instagram")||lower.includes("facebook")){reply+="Open Social Studio voor platformklare posts.";state.route="social"}else{var p=state.current||createProject("AI Website","website");state.current=p;generateWebsite(q);reply+="Ik heb de huidige website op basis van je prompt gegenereerd. Open Website Builder om visueel te bewerken."}state.msgs.push({who:"ai",text:reply});render()}$("#send").onclick=function(){go($("#prompt").value)};$$("[data-q]").forEach(function(b){b.onclick=function(){go(b.dataset.q)}})}
function generateWebsite(prompt){var p=state.current;if(!p)return;pushHistory();var words=clean(prompt,900),name=words.split(/[,.]/)[0].slice(0,55)||p.name;p.name=name;p.content={blocks:[{id:uid(),type:"hero",props:{title:name,text:"Professioneel, modern en volledig afgestemd op jouw opdracht.",button:"Neem contact op",bg:"#101827",color:"#ffffff"}},{id:uid(),type:"features",props:{title:"Onze voordelen",items:["Professionele aanpak","Snelle service","Duidelijke communicatie"],bg:"#ffffff",color:"#111827"}},{id:uid(),type:"text",props:{title:"Over "+name,text:words,bg:"#f8fafc",color:"#111827"}},{id:uid(),type:"cta",props:{title:"Klaar om te starten?",text:"Neem vandaag contact op voor meer informatie.",button:"Start nu",bg:"#6d28d9",color:"#ffffff"}}]};saveCurrent();log("website_generate")}
function blockHtml(b){var p=b.props||{},inner="";if(b.type==="hero")inner='<div class="hero" style="background:'+p.bg+';color:'+p.color+'"><span style="opacity:.7;font-weight:800">AI WEBSITE</span><h1>'+esc(p.title)+'</h1><p>'+esc(p.text)+'</p><span class="cta">'+esc(p.button)+'</span></div>';else if(b.type==="features")inner='<div class="section" style="background:'+p.bg+';color:'+p.color+'"><h2>'+esc(p.title)+'</h2><div class="features">'+(p.items||[]).map(function(x){return '<div class="feat">'+esc(x)+'</div>'}).join("")+'</div></div>';else if(b.type==="cta")inner='<div class="section" style="text-align:center;background:'+p.bg+';color:'+p.color+'"><h2>'+esc(p.title)+'</h2><p>'+esc(p.text)+'</p><span class="cta">'+esc(p.button)+'</span></div>';else inner='<div class="section" style="background:'+p.bg+';color:'+p.color+'"><h2>'+esc(p.title)+'</h2><p>'+esc(p.text)+'</p></div>';return '<div class="block '+(state.selected===b.id?"sel":"")+'" draggable="true" data-block="'+b.id+'">'+inner+'<div class="btools"><button data-up="'+b.id+'">↑</button><button data-down="'+b.id+'">↓</button><button data-edit="'+b.id+'">✎</button><button data-rm="'+b.id+'">×</button></div></div>'}
function inspector(){var b=state.current&&state.current.content.blocks.find(function(x){return x.id===state.selected});if(!b)return '<div class="muted">Selecteer een blok.</div>';var p=b.props;return '<div class="inspector"><label class="small">Titel</label><input class="input" data-prop="title" value="'+esc(p.title||"")+'"><label class="small">Tekst</label><textarea class="textarea" data-prop="text">'+esc(p.text||"")+'</textarea>'+(p.button!=null?'<label class="small">Knop</label><input class="input" data-prop="button" value="'+esc(p.button)+'">':'')+(p.items?'<label class="small">Items, één per regel</label><textarea class="textarea" id="items">'+esc(p.items.join("\n"))+'</textarea>':'')+'<label class="small">Achtergrond</label><input class="input" type="color" data-prop="bg" value="'+esc(p.bg||"#ffffff")+'"><label class="small">Tekstkleur</label><input class="input" type="color" data-prop="color" value="'+esc(p.color||"#111827")+'"></div>'}
function builder(){if(!state.current){state.current=createProject("Nieuwe website","website")}var blocks=state.current.content.blocks||[];shell('<div class="head"><div><h1>Website Builder</h1><p class="muted">Drag-and-drop, responsive preview en autosave.</p></div><div class="actions"><span class="small muted" id="save"></span><button class="btn" id="export">HTML export</button></div></div><div class="card" style="margin-bottom:10px"><div class="composer"><textarea class="textarea" id="wprompt" placeholder="Beschrijf de website die je wilt..."></textarea><button class="btn primary" id="gen">AI genereren</button></div></div><div class="builder"><div class="panel"><b>Componenten</b><button class="tool" draggable="true" data-new="hero">Hero</button><button class="tool" draggable="true" data-new="text">Tekst</button><button class="tool" draggable="true" data-new="features">Features</button><button class="tool" draggable="true" data-new="cta">CTA</button></div><div class="panel"><div class="toolbar"><div class="actions"><button class="btn sm" id="desk">Desktop</button><button class="btn sm" id="mob">Mobiel</button></div><div class="actions"><button class="btn sm" id="undo">↶ Undo</button><button class="btn sm" id="redo">↷ Redo</button></div></div><div class="device '+(state.device==="mobile"?"mobile":"")+'" id="canvas">'+blocks.map(blockHtml).join("")+'</div></div><div class="panel"><b>Eigenschappen</b><div style="height:10px"></div><div id="insp">'+inspector()+'</div></div></div>',"Website Builder");bindBuilder()}
function addBlock(type,at){pushHistory();var p={title:type==="hero"?"Nieuwe headline":type==="features"?"Voordelen":"Nieuwe sectie",text:"Bewerk deze tekst.",button:"Start nu",bg:type==="hero"||type==="cta"?"#111827":"#ffffff",color:type==="hero"||type==="cta"?"#ffffff":"#111827"};if(type==="features")p.items=["Voordeel 1","Voordeel 2","Voordeel 3"];var b={id:uid(),type:type,props:p};var a=state.current.content.blocks;if(at==null)a.push(b);else a.splice(at,0,b);state.selected=b.id;autosave();builder()}
function bindBuilder(){$("#desk").onclick=function(){state.device="desktop";builder()};$("#mob").onclick=function(){state.device="mobile";builder()};$("#gen").onclick=function(){var q=$("#wprompt").value.trim();if(!q)return toast("Voer een prompt in");generateWebsite(q);builder()};$("#undo").onclick=function(){if(!state.history.length)return;state.future.push(JSON.stringify(state.current.content));state.current.content=JSON.parse(state.history.pop());autosave();builder()};$("#redo").onclick=function(){if(!state.future.length)return;state.history.push(JSON.stringify(state.current.content));state.current.content=JSON.parse(state.future.pop());autosave();builder()};$("#export").onclick=function(){saveFile((state.current.name||"website").replace(/[^a-z0-9_-]/gi,"-")+".html",exportHtml(state.current.content),"text/html")};$$("[data-new]").forEach(function(b){b.onclick=function(){addBlock(b.dataset.new)};b.ondragstart=function(e){e.dataTransfer.setData("new",b.dataset.new)}});var cv=$("#canvas");cv.ondragover=function(e){e.preventDefault()};cv.ondrop=function(e){e.preventDefault();var n=e.dataTransfer.getData("new"),m=e.dataTransfer.getData("move");if(n)addBlock(n);else if(m){pushHistory();var a=state.current.content.blocks,i=a.findIndex(function(x){return x.id===m});if(i>=0)a.push(a.splice(i,1)[0]);autosave();builder()}};$$("[data-block]").forEach(function(el){el.ondragstart=function(e){e.dataTransfer.setData("move",el.dataset.block)};el.ondragover=function(e){e.preventDefault();e.stopPropagation();el.classList.add("drag")};el.ondragleave=function(){el.classList.remove("drag")};el.ondrop=function(e){e.preventDefault();e.stopPropagation();var m=e.dataTransfer.getData("move"),n=e.dataTransfer.getData("new"),target=el.dataset.block,a=state.current.content.blocks,to=a.findIndex(function(x){return x.id===target});if(n)return addBlock(n,to);if(m&&m!==target){pushHistory();var from=a.findIndex(function(x){return x.id===m});var item=a.splice(from,1)[0];to=a.findIndex(function(x){return x.id===target});a.splice(to,0,item);autosave();builder()}}});$$("[data-edit]").forEach(function(b){b.onclick=function(){state.selected=b.dataset.edit;builder()}});$$("[data-up]").forEach(function(b){b.onclick=function(){pushHistory();var a=state.current.content.blocks,i=a.findIndex(function(x){return x.id===b.dataset.up});if(i>0){var t=a[i-1];a[i-1]=a[i];a[i]=t}autosave();builder()}});$$("[data-down]").forEach(function(b){b.onclick=function(){pushHistory();var a=state.current.content.blocks,i=a.findIndex(function(x){return x.id===b.dataset.down});if(i<a.length-1){var t=a[i+1];a[i+1]=a[i];a[i]=t}autosave();builder()}});$$("[data-rm]").forEach(function(b){b.onclick=function(){pushHistory();state.current.content.blocks=state.current.content.blocks.filter(function(x){return x.id!==b.dataset.rm});state.selected=null;autosave();builder()}});$$("[data-prop]").forEach(function(el){el.onchange=function(){var b=state.current.content.blocks.find(function(x){return x.id===state.selected});if(!b)return;pushHistory();b.props[el.dataset.prop]=el.value;autosave();builder()}});var it=$("#items");if(it)it.onchange=function(){var b=state.current.content.blocks.find(function(x){return x.id===state.selected});pushHistory();b.props.items=it.value.split("\n").map(function(x){return clean(x,100)}).filter(Boolean);autosave();builder()}}
function exportHtml(c){var body=(c.blocks||[]).map(function(b){var p=b.props||{},s='style="background:'+esc(p.bg||"#fff")+';color:'+esc(p.color||"#111")+';padding:48px 7%;font-family:Arial,sans-serif"';if(b.type==="features")return '<section '+s+'><h2>'+esc(p.title)+'</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">'+(p.items||[]).map(function(x){return '<div style="padding:18px;border:1px solid #ccc;border-radius:10px">'+esc(x)+'</div>'}).join("")+'</div></section>';return '<section '+s+'><h1>'+esc(p.title)+'</h1><p>'+esc(p.text||"")+'</p>'+(p.button?'<a href="#" style="display:inline-block;padding:12px 18px;background:#7c3aed;color:#fff;border-radius:9px;text-decoration:none">'+esc(p.button)+'</a>':'')+'</section>'}).join("");return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website</title><style>body{margin:0}*{box-sizing:border-box}</style></head><body>'+body+'</body></html>'}
function saveFile(name,data,mime){try{if(window.Android&&Android.saveFile){Android.saveFile(name,data,mime);toast("Opgeslagen in Downloads")}else{var a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}}catch(e){toast(e.message)}}
function logoSvg(name,i){var cols=[["#111827","#8b5cf6"],["#0f172a","#0ea5e9"],["#1c1917","#d4af37"],["#052e2b","#14b8a6"]][i];var initials=name.split(/\s+/).map(function(x){return x[0]}).join("").slice(0,2).toUpperCase()||"AI";return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" rx="36" fill="'+cols[0]+'"/><circle cx="130" cy="180" r="74" fill="'+cols[1]+'"/><text x="130" y="197" text-anchor="middle" font-family="Arial" font-size="52" font-weight="800" fill="white">'+esc(initials)+'</text><text x="230" y="178" font-family="Arial" font-size="45" font-weight="800" fill="white">'+esc(name)+'</text><text x="232" y="215" font-family="Arial" font-size="18" fill="#cbd5e1">CREATED WITH AI CREATOR STUDIO</text></svg>'}
function logo(){shell('<div class="head"><div><h1>AI Logo Studio</h1><p class="muted">Maak schaalbare SVG-logo’s.</p></div></div><div class="card"><div class="composer"><input class="input" id="lp" placeholder="Bedrijfsnaam of logo-prompt"><button class="btn primary" id="lg">Genereer</button></div></div><div style="height:12px"></div><div class="grid logos" id="logos"><div class="empty">Nog geen logo’s.</div></div>',"Logo Studio");$("#lg").onclick=function(){var n=clean($("#lp").value,80);if(!n)return toast("Voer een naam in");var vs=[0,1,2,3].map(function(i){return logoSvg(n,i)});$("#logos").innerHTML=vs.map(function(s,i){return '<div class="logo">'+s+'<button class="btn sm" data-svg="'+i+'">Download SVG</button></div>'}).join("");$$("[data-svg]").forEach(function(b){b.onclick=function(){saveFile("logo-"+(Number(b.dataset.svg)+1)+".svg",vs[Number(b.dataset.svg)],"image/svg+xml")}});log("logo_generate")}}
function social(){shell('<div class="head"><div><h1>AI Social Media Studio</h1><p class="muted">Instagram, Facebook en X vanuit één prompt.</p></div></div><div class="card"><div class="composer"><textarea class="textarea" id="sp" placeholder="Beschrijf campagne, actie en doelgroep"></textarea><button class="btn primary" id="sg">Genereer</button></div></div><div style="height:12px"></div><div class="grid social" id="posts"><div class="empty">Nog geen posts.</div></div>',"Social Studio");$("#sg").onclick=function(){var p=clean($("#sp").value,1000);if(!p)return toast("Voer een prompt in");var arr=[["Instagram","✨ "+p+"\n\nOntdek het verschil. Stuur ons een bericht voor meer info.\n\n#business #service #kwaliteit"],["Facebook",p+"\n\nWe maken het eenvoudig, duidelijk en professioneel. Interesse? Reageer of stuur een privébericht."],["X",p.slice(0,190)+" — Meer info via DM."]];$("#posts").innerHTML=arr.map(function(x,i){return '<div class="card"><span class="badge">'+x[0]+'</span><pre>'+esc(x[1])+'</pre><button class="btn sm" data-cp="'+i+'">Kopieer</button></div>'}).join("");$$("[data-cp]").forEach(function(b){b.onclick=async function(){var t=arr[Number(b.dataset.cp)][1];try{await navigator.clipboard.writeText(t)}catch(e){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}toast("Gekopieerd")}});log("social_generate")}}
function admin(){if(state.user.role!=="admin"){state.route="dashboard";return render()}var us=read(DB.U,[]),ps=read(DB.P,[]),ac=read(DB.A,[]).slice(0,12);shell('<div class="head"><div><h1>Admin dashboard</h1><p class="muted">Statistieken en beveiligingsstatus.</p></div></div><div class="grid stats"><div class="card"><span class="muted small">Gebruikers</span><div class="stat">'+us.length+'</div></div><div class="card"><span class="muted small">Projecten</span><div class="stat">'+ps.length+'</div></div><div class="card"><span class="muted small">Sessies</span><div class="stat">'+(read(DB.S,null)?1:0)+'</div></div><div class="card"><span class="muted small">Rate limiting</span><div class="stat" style="font-size:20px">Actief</div></div></div><div style="height:12px"></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Beveiliging</h3><p>✓ PBKDF2-SHA256 wachtwoordhashing</p><p>✓ Input sanitization</p><p>✓ Lokale rate limiting</p><p>✓ Gebruikersdata logisch gescheiden</p><p>✓ Geen externe secrets in de APK</p></div><div class="card"><h3>Recente activiteit</h3>'+(ac.length?ac.map(function(a){return '<p><b>'+esc(a.a)+'</b><br><span class="small muted">'+new Date(a.t).toLocaleString("nl-BE")+'</span></p>'}).join(""):'<p class="muted">Geen activiteit.</p>')+'</div></div>',"Admin")}
